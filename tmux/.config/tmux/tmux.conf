set-option -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

# reload config file
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Sourced tmux.conf"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Sessions survive a restart: saved every 15 minutes, restored when tmux starts
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

set -g base-index 1              # start indexing windows at 1 instead of 0
setw -g pane-base-index 1
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g detach-on-destroy off     # closing a session switches to another one instead of leaving tmux

# Open panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind 'w' new-window -c "#{pane_current_path}"

# Projects: one session per project, picked with sesh (prefix s). The tmux session tree moves to prefix S.
bind s display-popup -E -w 60% -h 70% -T " Projects " "sesh picker -i"
bind S choose-tree -Zs

# Status line at the top: windows on the left, session on the right. The right side shows when the
# prefix is pressed and when a pane is zoomed.
set -g status-position top
set -g status-justify left
set -g status-left ""
set -g status-right-length 60
set -g window-status-separator ""
set -g window-status-format "#[fg=#{@rp_muted}] #I #W "
set -g window-status-current-format "#[fg=#{@rp_text},bg=#{@rp_overlay},bold] #I #W #[default]"
set -g status-right "#{?client_prefix,#[fg=#{@rp_gold}]󰘳 prefix ,}#{?window_zoomed_flag,#[fg=#{@rp_foam}]󰁌 zoom ,}#[fg=#{@rp_iris},bold] #S "

# Colours: Rosé Pine Moon
source-file ~/.config/tmux/themes/rose-pine-moon.conf

# Automatic installation of TPM and all plugins, that are registered via TPM
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
