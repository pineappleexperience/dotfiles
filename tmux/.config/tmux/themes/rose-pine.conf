# Styles in the colours of the sourced Rosé Pine variant. -F expands the colour options.

set -gF status-style "bg=#{@rp_base},fg=#{@rp_subtle}"
set -gF message-style "bg=#{@rp_surface},fg=#{@rp_text}"
set -gF message-command-style "bg=#{@rp_surface},fg=#{@rp_text}"
set -gF mode-style "bg=#{@rp_highlight},fg=#{@rp_text}"
set -gF pane-border-style "fg=#{@rp_overlay}"
set -gF pane-active-border-style "fg=#{@rp_iris}"
set -gF popup-style "bg=#{@rp_base},fg=#{@rp_text}"
set -gF popup-border-style "fg=#{@rp_iris}"
set -gF clock-mode-colour "#{@rp_iris}"
