# Colours from the terminal's 16-colour palette, so tmux follows the terminal theme (Rosé Pine Moon in
# dark mode, Rosé Pine Dawn in light mode): 0 overlay, 1 love, 2 pine, 3 gold, 4 foam, 5 iris, 6 rose,
# 7 text, 8 muted.

set -g status-style "bg=default,fg=colour8"
set -g message-style "bg=colour0,fg=colour7"
set -g message-command-style "bg=colour0,fg=colour7"
set -g mode-style "bg=colour0,fg=colour7"
set -g pane-border-style "fg=colour0"
set -g pane-active-border-style "fg=colour5"
set -g popup-style "bg=default,fg=colour7"
set -g popup-border-style "fg=colour5"
set -g clock-mode-colour "colour5"

set -g window-status-separator ""
set -g window-status-format "#[fg=colour8] #I #W "
set -g window-status-current-format "#[fg=colour7,bg=colour0,bold] #I #W #[default]"
set -g status-right "#{?client_prefix,#[fg=colour3]󰘳 prefix ,}#{?window_zoomed_flag,#[fg=colour4]󰁌 zoom ,}#[fg=colour5,bold] #S "
